<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Martinez</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #58a6ff, #79c0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.tagline {
      font-size: 1.1rem;
      color: #8b949e;
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      color: #e6edf3;
      background: #21262d;
      border: 1px solid #30363d;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    .links a:hover {
      border-color: #58a6ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Alex Martinez</h1>
    <p class="tagline">Bienvenido a mi espacio en la web.</p>
    <div class="links">
      <a href="mailto:tu@email.com">Contacto</a>
      <a href="https://github.com/alexmartineztech">GitHub</a>
      <a href="https://www.linkedin.com/in/tu-perfil">LinkedIn</a>
    </div>
  </div>
</body>
</html>
